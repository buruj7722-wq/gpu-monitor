name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          npm ci --ignore-scripts
      - name: Lint, formatting and types
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
          .venv/bin/mypy monitor app.py gpu.py
          npm run typecheck
          npm run format:check
      - name: Install isolated proxy test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y nginx openssl
      - name: Unit, integration, API and WebSocket tests (mock NVML)
        run: .venv/bin/pytest --cov=monitor --cov-report=term-missing --cov-report=xml
      - name: Verify vendored assets and build
        run: |
          npm run vendor
          git diff --exit-code -- static/vendor
          .venv/bin/python -m build --no-isolation
          .venv/bin/python scripts/check_wheel.py
      - name: Browser tests (test-only synthetic telemetry)
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Security checks
        run: |
          .venv/bin/bandit -r monitor -c pyproject.toml
          .venv/bin/pip-audit --no-deps --disable-pip -r requirements-dev.txt
          npm audit --audit-level=high
          .venv/bin/detect-secrets scan --exclude-files '(package-lock.json|requirements.*|static/vendor/.*)' > /tmp/gpu-monitor-secrets.json
          python scripts/check_secrets.py /tmp/gpu-monitor-secrets.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: validation-artifacts
          path: |
            coverage.xml
            test-results/
            dist/
          retention-days: 7
