<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU Monitor</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>NVIDIA GPU Monitor</h1>

    <div class="cards">

        <div class="card">
            <h3>GPU</h3>
            <h2 id="gpu-name">Loading...</h2>
        </div>

        <div class="card">
            <h3>Temperature</h3>
            <h2 id="temp">-- °C</h2>
        </div>

        <div class="card">
            <h3>GPU Usage</h3>

            <div class="bar">
                <div class="fill" id="gpu-bar"></div>
            </div>

            <h2 id="gpu-util">0%</h2>
        </div>

        <div class="card">
            <h3>Memory</h3>

            <div class="bar">
                <div class="fill" id="mem-bar"></div>
            </div>

            <h2 id="memory">0 / 0 MB</h2>
        </div>

        <div class="card">
            <h3>Power</h3>
            <h2 id="power">0 / 0 W</h2>
        </div>

        <div class="card">
            <h3>Fan</h3>
            <h2 id="fan">0%</h2>
        </div>

    </div>

    <h2 style="margin-top:40px;">Running Processes</h2>

    <table>

        <thead>
            <tr>
                <th>PID</th>
                <th>Process</th>
                <th>GPU Memory</th>
            </tr>
        </thead>

        <tbody id="processes">
            <tr>
                <td colspan="3">Loading...</td>
            </tr>
        </tbody>

    </table>

    <div class="status">
        Last Update :
        <span id="updated">--</span>
    </div>

</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>

</body>
</html>
